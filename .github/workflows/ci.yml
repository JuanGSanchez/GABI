# .github/workflows/ci.yml
# ---------------------------------------------------------------------------
# Continuous Integration for GABI (Java 17 / Maven / Spring Boot)
#
# WHAT THIS WORKFLOW DEMONSTRATES (GitHub Actions core concepts):
#   - Triggers (`on:`)        when the workflow runs (push / pull_request)
#   - Jobs & steps            a job runs on a fresh runner; steps run in order
#   - Marketplace actions     reusable steps via `uses:` (checkout, setup-java)
#   - Dependency caching      `cache: maven` reuses ~/.m2 across runs
#   - Virtual display (Xvfb)  Swing tests need a display; Xvfb provides a fake one
#   - Artifacts               upload Surefire + JaCoCo reports for download
#   - Required status checks  this job's green tick can be made to gate merges
# ---------------------------------------------------------------------------
name: CI

# WHEN it runs: every push to main, and every pull request targeting main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel an in-flight run for the same branch/PR when a newer push arrives.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test (JDK 17)
    runs-on: ubuntu-latest
    steps:
      # 1) Check the repository out onto the runner.
      - name: Check out code
        uses: actions/checkout@v4

      # 2) Install Temurin JDK 17 (the project baseline) and cache ~/.m2.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3) Xvfb = X virtual framebuffer. Java Swing/AWT needs a display even for
      #    headless-style tests; unlike Qt, AWT has no "offscreen" platform, so
      #    we run the build under a virtual display.
      - name: Install Xvfb (virtual display)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 4) `verify` compiles, runs the JUnit 5 tests via Surefire, and runs the
      #    JaCoCo 90% coverage check (both wired in pom.xml). `-B` = batch mode
      #    (no interactive/ANSI noise). `./mvnw` uses the pinned wrapper version.
      - name: Build, test, coverage gate
        run: xvfb-run --auto-servernum ./mvnw -B verify

      # 5) Save the test + coverage reports as a downloadable artifact, even on
      #    failure, so you can inspect what broke.
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: ignore
