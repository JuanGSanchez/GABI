# GABI centralized widget-info registry (SPEC-01) — DEFAULT (English) locale.
#
# Single source of widget help text for the WHOLE desktop UI. Every interactive
# component is registered via ui.info.WidgetInfo.register(component, key); the same
# entry supplies BOTH the tooltip text and the AccessibleContext accessible description.
# No scattered inline setToolTipText("literal") anywhere — the grep gate enforces it.
#
# Locale variants: info_en.properties (EN) / info_es.properties (ES). Keys MUST match
# across all variants (a coverage test asserts every key resolves in both).

# --- Toolbar actions (shared across entity panels) ---
info.toolbar.add=Register a new entry in the catalogue
info.toolbar.list=Reload and list all current entries
info.toolbar.search=Find entries matching a field and text fragment
info.toolbar.remove=Remove the selected entry (rules enforced by the core)

# --- Main shell ---
info.tab.books=Books catalogue: titles available to lend
info.tab.members=Registered members of the library
info.tab.loans=Active loans of books to members
info.tab.users=Database user administration (admin only)
info.menu.help=Show help and widget information
info.menu.exit=Close the application

# --- AI assistant panel (SPEC-02) ---
info.assistant.input=Type a message for the AI assistant and press Send
info.assistant.send=Send the message to the configured AI provider
info.assistant.clear=Clear the conversation and start a new session
info.assistant.context=Include current catalogue context in the next prompt
info.assistant.provider=Select the AI provider and model (configured at runtime)
