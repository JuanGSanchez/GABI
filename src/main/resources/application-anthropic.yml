# GABI — Anthropic profile configuration
# Activate with: -Dspring.profiles.active=anthropic
# Required env var: ANTHROPIC_API_KEY
#
# Anthropic provides chat only (no embedding model in Spring AI — research finding L4).
# Embeddings continue to use Ollama (nomic-embed-text, configured in application.yml).
# So this profile: Anthropic chat + Ollama embeddings.
#
# SECURITY: NEVER commit a real ANTHROPIC_API_KEY to this file.
# Set the environment variable:
#   export ANTHROPIC_API_KEY=sk-ant-...
#   java -Dspring.profiles.active=anthropic -jar gabi-1.0.0-exec.jar
# ============================================================

spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_CHAT_MODEL:claude-3-5-haiku-latest}
    # Keep Ollama embedding active for the vector store (Anthropic has no embedding model)
    ollama:
      chat:
        enabled: false   # Anthropic handles chat
      embedding:
        enabled: true    # Ollama handles embeddings
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
